name: Build Kernels

# ★ 全矩阵 GKI 内核构建 + 自动 Release + Telegram 通知
# 默认值 = 推荐配置（同 Kernel Build 单版本）。
on:
  workflow_dispatch:
    inputs:
      # ==================== SukiSU / SUSFS ====================
      kernelsu_commit:
        description: '指定 SukiSU commit hash (可选，留空=分支最新)'
        required: false
        type: string
        default: ''
      susfs_commit:
        description: '指定 SUSFS commit hash 或 HEAD~N (可选)'
        required: false
        type: string
        default: ''
      enable_susfs:
        description: '构建 SUSFS（内核侧补丁+配置）'
        required: true
        type: boolean
        default: true
      sukisu_branch:
        description: 'SukiSU 分支/ref（builtin=SUSFS 内置源码）'
        required: true
        type: choice
        options:
          - builtin
          - main
          - dev
        default: builtin

      # ==================== 功能开关 ====================
      use_kpm:
        description: 'KPM（enabled=开启，patched=开启并修补镜像，仅 5.x 有效）'
        required: true
        type: choice
        options:
          - "disabled (关闭)"
          - "enabled (开启)"
          - "patched (开启+修补镜像)"
        default: "enabled (开启)"
      use_zram:
        description: '启用 ZRAM (LZ4KD)'
        required: true
        type: boolean
        default: true
      BBG:
        description: '启用 Baseband-guard'
        required: true
        type: boolean
        default: true
      cve_2026_43499_patch:
        description: '应用 CVE-2026-43499 rtmutex 修复链 (GhostLock)'
        required: true
        type: boolean
        default: true
      set_defbbr:
        description: '设置 BBR 为默认拥塞算法'
        required: true
        type: boolean
        default: false
      supp_op:
        description: '启用 OnePlus 8E 支持（非一加勿开）'
        required: true
        type: boolean
        default: false

      # ==================== 隐藏伪装（全矩阵统一生效） ====================
      spoof_version:
        description: '启用内核名伪装'
        required: true
        type: boolean
        default: false
      custom_version:
        description: '伪装内核名后缀（-android12-9-… 或完整 5.10.236-…，不带前导-更稳）'
        required: false
        type: string
        default: ''
      spoof_build_time:
        description: '启用构建时间伪装'
        required: true
        type: boolean
        default: false
      build_time:
        description: '伪装构建时间，如 Tue Oct 21 03:03:12 UTC 2025'
        required: false
        type: string
        default: ''

      # ==================== 管理器 ====================
      get_manager:
        description: '拉取管理器 APK 并附加到 Release'
        required: true
        type: boolean
        default: true
      manager_source:
        description: '管理器来源'
        required: true
        type: choice
        options:
          - SukiSU
          - ReSukiSU
        default: SukiSU
      manager_spoofed:
        description: '一并拉取 Spoofed（伪装官方）管理器'
        required: true
        type: boolean
        default: true

      # ==================== 发布与通知 ====================
      make_release:
        description: '创建 GitHub Release'
        required: true
        type: boolean
        default: true
      send_telegram:
        description: '发送 Telegram 通知'
        required: true
        type: boolean
        default: true

permissions:
  contents: write
  actions: write

env:
  PYTHON_VERSION: '3.10'

jobs:
  prepare:
    runs-on: ubuntu-latest
    env:
      SCRIPTS_DIR: ./.github/workflows/scripts
    outputs:
      build_matrix: ${{ steps.generate.outputs.matrix }}
      kernel_version: ${{ steps.generate.outputs.kernel_version }}
      classified_matrix: ${{ steps.generate.outputs.classified_matrix }}
      matrix_summary: ${{ steps.generate.outputs.matrix_summary }}
      cache_key: ${{ steps.get_cache_key.outputs.cache_key }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Get cache key
        id: get_cache_key
        run: echo "cache_key=${{ github.ref_name }}-ccache" >> $GITHUB_OUTPUT

      - name: Generate build matrix
        id: generate
        run: python3 ${{ env.SCRIPTS_DIR }}/matrix_generator.py

  # ==================== 管理器（可选） ====================
  get-manager:
    if: inputs.get_manager
    uses: ./.github/workflows/manager.yml
    with:
      kernelsu_source: ${{ inputs.manager_source }}
      spoofed: ${{ inputs.manager_spoofed }}

  build:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        config: ${{ fromJson(needs.prepare.outputs.build_matrix) }}
    env:
      SCRIPTS_DIR: ./.github/workflows/scripts
    steps:
      - name: Maximize build space
        uses: AdityaGarg8/remove-unwanted-software@v5
        with:
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'
          remove-large-packages: 'true'
          remove-swapfile: 'true'
          verbose: 'true'

      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          sudo apt update && sudo apt upgrade -y
          sudo apt install -y ccache python3 git curl wget zip unzip xz-utils openssl pixz zstd
          pip install PyYAML python-multipart

      - name: Setup AVB signing key
        env:
          BOOT_SIGN_KEY: ${{ secrets.BOOT_SIGN_KEY }}
        run: |
          mkdir -p toolchain/linux-x86/bin
          if [ -n "$BOOT_SIGN_KEY" ]; then
            echo "$BOOT_SIGN_KEY" > toolchain/linux-x86/bin/testkey.pem
          else
            openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 > toolchain/linux-x86/bin/testkey.pem
          fi
          echo "BOOT_SIGN_KEY_PATH=$GITHUB_WORKSPACE/toolchain/linux-x86/bin/testkey.pem" >> $GITHUB_ENV

      - name: Configure ccache
        run: |
          mkdir -p ~/.cache/bazel
          mkdir -p ~/.ccache
          ccache --version
          ccache --max-size=2G
          ccache --set-config=compression=true
          echo "CCACHE_DIR=$HOME/.ccache" >> $GITHUB_ENV

      - name: Restore ccache
        id: restore-ccache
        uses: ./.github/actions/cache-restore
        with:
          cache_path: /home/runner/.ccache
          cache_key: ${{ github.ref_name }}-${{ matrix.config.android }}-${{ matrix.config.kernel }}-${{ matrix.config.sub_level }}
          cache_bucket: ccache-cache

      - name: Build kernel
        env:
          GKI_BUILD_TIME: ${{ (inputs.spoof_build_time == 'true') && inputs.build_time || '' }}
        run: |
          cd ${{ env.SCRIPTS_DIR }}

          ARGS="--android ${{ matrix.config.android }}"
          ARGS="$ARGS --kernel ${{ matrix.config.kernel }}"
          ARGS="$ARGS --sub-level ${{ matrix.config.sub_level }}"
          ARGS="$ARGS --os-patch ${{ matrix.config.os_patch }}"
          [ -n "${{ matrix.config.revision }}" ] && ARGS="$ARGS --revision ${{ matrix.config.revision }}"
          ARGS="$ARGS --no-release"

          # SUSFS / SukiSU 分支 / KPM / 特性（解耦勾选）
          [ "${{ inputs.enable_susfs }}" = "true" ] || ARGS="$ARGS --no-susfs"
          [ "${{ inputs.sukisu_branch }}" != "builtin" ] && ARGS="$ARGS --ksu-branch=${{ inputs.sukisu_branch }}"
          [ "${{ inputs.use_kpm }}" = "disabled (关闭)" ] && ARGS="$ARGS --no-kpm"
          [ "${{ inputs.use_zram }}" = "true" ] && ARGS="$ARGS --zram"
          [ "${{ inputs.BBG }}" = "true" ] && ARGS="$ARGS --bbg"
          [ "${{ inputs.cve_2026_43499_patch }}" = "true" ] && ARGS="$ARGS --cve-2026-43499"
          [ "${{ inputs.supp_op }}" = "true" ] && ARGS="$ARGS --op8e"
          [ "${{ inputs.set_defbbr }}" = "true" ] && ARGS="$ARGS --bbr"

          # commit 锁定
          [ -z "${{ inputs.kernelsu_commit }}" ] || ARGS="$ARGS --ksu-commit=${{ inputs.kernelsu_commit }}"
          [ -z "${{ inputs.susfs_commit }}" ] || ARGS="$ARGS --susfs-commit=${{ inputs.susfs_commit }}"

          # 伪装（勾选后生效）
          if [ "${{ inputs.spoof_version }}" = "true" ] && [ -n "${{ inputs.custom_version }}" ]; then
            CV="${{ inputs.custom_version }}"
            case "$CV" in
              -*) ARGS="$ARGS --custom-version=$CV" ;;
              *)  ARGS="$ARGS --custom-version=-$CV" ;;
            esac
          fi

          python3 build.py $ARGS

      - name: Save ccache
        uses: ./.github/actions/cache-save
        with:
          cache_path: /home/runner/.ccache
          cache_key: ${{ github.ref_name }}-${{ matrix.config.android }}-${{ matrix.config.kernel }}-${{ matrix.config.sub_level }}
          cache_bucket: ccache-cache
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare artifacts
        id: prepare-artifacts
        run: |
          mkdir -p artifacts
          find /tmp/gki-build -name "*.zip" -type f -exec cp {} artifacts/ \;
          find /tmp/gki-build -name "*.img" -type f -exec cp {} artifacts/ \;
          if [ -z "$(ls -A artifacts/)" ]; then
            echo "没有找到构建产物"
            echo "artifacts_exist=false" >> $GITHUB_OUTPUT
          else
            echo "artifacts_exist=true" >> $GITHUB_OUTPUT
            ls -la artifacts/
            cd artifacts && sha256sum * > SHA256SUMS.txt && cd ..
          fi

      - name: Upload artifacts
        if: steps.prepare-artifacts.outputs.artifacts_exist == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: kernel-${{ matrix.config.android }}-${{ matrix.config.kernel }}-${{ matrix.config.sub_level }}
          path: artifacts/*

      - name: Record build result
        if: always()
        run: |
          mkdir -p build-results
          if [ -f "artifacts/SHA256SUMS.txt" ]; then
            cp artifacts/SHA256SUMS.txt build-results/${{ matrix.config.android }}-${{ matrix.config.kernel }}-${{ matrix.config.sub_level }}.txt
          fi
          echo "${{ matrix.config.android }}-${{ matrix.config.kernel }}-${{ matrix.config.sub_level }}:outcome=${{ job.status }}" >> build-results/status.txt

      - name: Upload build results
        uses: actions/upload-artifact@v7
        with:
          name: build-results-${{ matrix.config.android }}-${{ matrix.config.kernel }}-${{ matrix.config.sub_level }}
          path: build-results/
          retention-days: 1

  release:
    needs: [prepare, build, get-manager]
    # always(): get-manager 关闭(跳过)时 Release 仍照常执行
    if: ${{ always() && !cancelled() && inputs.make_release == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      SCRIPTS_DIR: ./.github/workflows/scripts
      WORKSPACE_ROOT: ${{ github.workspace }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Download all kernel artifacts
        uses: actions/download-artifact@v8
        with:
          path: all-artifacts
          pattern: 'kernel-*'
          merge-multiple: true

      - name: Download build results
        uses: actions/download-artifact@v8
        with:
          pattern: 'build-results-*'
          path: build-results
          merge-multiple: true

      - name: Prepare build summary
        id: prepare-summary
        run: |
          mkdir -p build-results
          echo "=== 构建摘要 ===" >> $GITHUB_STEP_SUMMARY
          TOTAL=$(cat build-results/status.txt 2>/dev/null | wc -l || echo 0)
          SUCCESS=$(grep ':outcome=success$' build-results/status.txt 2>/dev/null | wc -l || echo 0)
          FAILED=$(grep ':outcome=failure$' build-results/status.txt 2>/dev/null | wc -l || echo 0)
          echo "total=$TOTAL" >> $GITHUB_OUTPUT
          echo "success=$SUCCESS" >> $GITHUB_OUTPUT
          echo "failed=$FAILED" >> $GITHUB_OUTPUT
          echo "| Total | Success | Failed |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|---------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| $TOTAL | $SUCCESS | $FAILED |" >> $GITHUB_STEP_SUMMARY
          echo "=== 状态 ==="
          cat build-results/status.txt 2>/dev/null || echo "No status file"

      - name: Prepare release files
        id: prepare-release-files
        if: steps.prepare-summary.outputs.success != '0'
        run: |
          mkdir -p release-files
          python3 ${{ env.SCRIPTS_DIR }}/extract_artifacts.py all-artifacts release-files --build-results build-results
          ls -la release-files/

      - name: Download manager APK
        if: steps.prepare-release-files.conclusion == 'success'
        uses: actions/download-artifact@v8
        with:
          path: manager-dl
          pattern: 'manager-apk'
          merge-multiple: true

      - name: Attach manager APK to release
        if: steps.prepare-release-files.conclusion == 'success'
        run: |
          mkdir -p release-files/managers
          find manager-dl -type f -name '*.apk' -exec cp {} release-files/managers/ \; 2>/dev/null || true
          ls -la release-files/managers/ 2>/dev/null || echo "(无管理器 APK，跳过)"

      - name: Generate release body
        if: steps.prepare-summary.outputs.success != '0'
        run: |
          python3 ${{ env.SCRIPTS_DIR }}/release_generator.py ${{ env.WORKSPACE_ROOT }}/release-files/RELEASE_BODY.md
          echo "=== 发布内容 ==="
          cat release-files/RELEASE_BODY.md

      - name: Create release
        if: steps.prepare-summary.outputs.success != '0'
        uses: softprops/action-gh-release@v3
        id: create_release
        with:
          tag_name: ${{ needs.prepare.outputs.kernel_version }}
          name: GKI Kernel ${{ needs.prepare.outputs.kernel_version }}
          draft: false
          generate_release_notes: false
          files: |
            release-files/*
          body_path: release-files/RELEASE_BODY.md

      - name: Get release URL
        if: steps.prepare-summary.outputs.success != '0'
        id: get-release-url
        run: |
          RELEASE_URL="https://github.com/${{ github.repository }}/releases/tag/${{ needs.prepare.outputs.kernel_version }}"
          echo "release_url=$RELEASE_URL" >> $GITHUB_OUTPUT
          echo "Release URL: $RELEASE_URL"

      - name: Send Telegram Notification
        if: ${{ inputs.send_telegram == 'true' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_MESSAGE_THREAD_ID: ${{ secrets.TELEGRAM_MESSAGE_THREAD_ID }}
          SUCCESS: ${{ steps.prepare-summary.outputs.success }}
          FAILED: ${{ steps.prepare-summary.outputs.failed }}
        run: |
          if [ "$SUCCESS" -gt 0 ]; then
            python3 ${{ env.SCRIPTS_DIR }}/telegram_notify.py release \
              "${{ needs.prepare.outputs.kernel_version }}" \
              "${{ steps.get-release-url.outputs.release_url }}" \
              "${{ env.WORKSPACE_ROOT }}/release-files/RELEASE_BODY.md" \
              "" "" "$SUCCESS" "$FAILED" || true
          else
            python3 ${{ env.SCRIPTS_DIR }}/telegram_notify.py release \
              "${{ needs.prepare.outputs.kernel_version }}" \
              "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
              "" "" "" "0" "${{ steps.prepare-summary.outputs.total }}" || true
          fi
