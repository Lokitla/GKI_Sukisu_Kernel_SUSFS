name: Kernel Build

# ★ 单版本 GKI 内核构建（全功能可勾选）
# 默认值 = 推荐配置：SukiSU + SUSFS(内置) + KPM + LZ4KD + BBG + GhostLock CVE
# 完整矩阵 + 自动 Release 请用 "Build Kernels" 工作流。
on:
  workflow_dispatch:
    inputs:
      # ==================== 基础版本 ====================
      android_version:
        description: 'Android 版本'
        required: true
        type: choice
        options:
          - android12
          - android13
          - android14
          - android15
        default: android12
      kernel_version:
        description: 'Kernel 版本'
        required: true
        type: choice
        options:
          - "5.10"
          - "5.15"
          - "6.1"
          - "6.6"
        default: "5.10"
      sub_level:
        description: 'Sub Level 版本（5.10.236 → 填 236；LTS 填 X）'
        required: true
        type: string
        default: '236'
      os_patch_level:
        description: 'OS Patch Level（5.10.236 对应 2025-05）'
        required: true
        type: string
        default: '2025-05'
      revision:
        description: 'Android 12 Revision (可选)'
        required: false
        type: string
        default: 'r1'
      kernelsu_commit:
        description: '指定 SukiSU commit hash (可选，留空=最新)'
        required: false
        type: string
        default: ''
      susfs_commit:
        description: '指定 SUSFS commit hash 或 HEAD~N (可选)'
        required: false
        type: string
        default: ''
      kernelsu_version:
        description: 'SukiSU 版本'
        required: true
        type: choice
        options:
          - Stable(标准)
          - Dev(开发)
        default: Stable(标准)

      # ==================== KernelSU / SUSFS ====================
      enable_susfs:
        description: '构建 SUSFS（内核侧补丁+配置）'
        required: true
        type: boolean
        default: true
      susfs_builtin:
        description: 'SUSFS 内置（SukiSU builtin 模式；关闭=main 非内置）'
        required: true
        type: boolean
        default: true

      # ==================== 功能开关 ====================
      use_kpm:
        description: 'KPM（enabled=开启，patched=开启并修补镜像，仅 5.x 有效）'
        required: true
        type: choice
        options:
          - "disabled (关闭)"
          - "enabled (开启)"
          - "patched (开启+修补镜像)"
        default: "enabled (开启)"
      use_zram:
        description: '启用 ZRAM (LZ4KD)'
        required: true
        type: boolean
        default: true
      BBG:
        description: '启用 Baseband-guard'
        required: true
        type: boolean
        default: true
      cve_2026_43499_patch:
        description: '应用 CVE-2026-43499 rtmutex 修复链 (GhostLock)'
        required: true
        type: boolean
        default: true
      set_defbbr:
        description: '设置 BBR 为默认拥塞算法'
        required: true
        type: boolean
        default: false
      supp_op:
        description: '启用 OnePlus 8E 支持（非一加勿开）'
        required: true
        type: boolean
        default: false

      # ==================== 隐藏伪装 ====================
      spoof_version:
        description: '启用内核名伪装（需配合下方版本名）'
        required: true
        type: boolean
        default: false
      custom_version:
        description: '伪装内核名：如 -android12-9-00003-g<sha>-ab<bid>（带/不带前导-均可）'
        required: false
        type: string
        default: ''
      spoof_build_time:
        description: '启用构建时间伪装'
        required: true
        type: boolean
        default: false
      build_time:
        description: '伪装构建时间，如 Tue Oct 21 03:03:12 UTC 2025（N/留空=当前UTC）'
        required: false
        type: string
        default: ''

      # ==================== 管理器 ====================
      get_manager:
        description: '拉取 KernelSU 管理器 APK'
        required: true
        type: boolean
        default: true
      manager_source:
        description: '管理器来源'
        required: true
        type: choice
        options:
          - SukiSU
          - ReSukiSU
        default: SukiSU
      manager_spoofed:
        description: '一并拉取 Spoofed（伪装官方）管理器'
        required: true
        type: boolean
        default: true

      # ==================== 通知 ====================
      send_telegram:
        description: '发送 Telegram 通知'
        required: true
        type: boolean
        default: true

permissions:
  contents: write
  actions: write

env:
  PYTHON_VERSION: '3.10'

jobs:
  # ==================== 管理器 ====================
  get-manager:
    if: inputs.get_manager
    uses: ./.github/workflows/manager.yml
    with:
      kernelsu_source: ${{ inputs.manager_source }}
      spoofed: ${{ inputs.manager_spoofed }}

  # ==================== 编译 ====================
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Maximize build space
        uses: AdityaGarg8/remove-unwanted-software@v5
        with:
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'
          remove-large-packages: 'true'
          remove-swapfile: 'true'
          verbose: 'true'

      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          sudo apt update && sudo apt upgrade -y
          sudo apt install -y ccache python3 git curl wget zip unzip
          pip install PyYAML

      - name: Configure ccache
        run: |
          mkdir -p ~/.cache/bazel
          ccache --version
          ccache --max-size=2G
          ccache --set-config=compression=true
          echo "CCACHE_DIR=$HOME/.ccache" >> $GITHUB_ENV

      - name: Restore ccache
        uses: actions/cache@v5
        with:
          path: ~/.ccache
          key: ${{ github.event.inputs.android_version }}-${{ github.event.inputs.kernel_version }}-${{ github.event.inputs.sub_level }}-ccache-${{ github.sha }}
          restore-keys: |
            ${{ github.event.inputs.android_version }}-${{ github.event.inputs.kernel_version }}-${{ github.event.inputs.sub_level }}-ccache-

      - name: Build kernel
        env:
          GKI_BUILD_TIME: ${{ (github.event.inputs.spoof_build_time == 'true') && github.event.inputs.build_time || '' }}
        run: |
          cd ./.github/workflows/scripts

          ARGS="--android ${{ github.event.inputs.android_version }}"
          ARGS="$ARGS --kernel ${{ github.event.inputs.kernel_version }}"
          ARGS="$ARGS --sub-level ${{ github.event.inputs.sub_level }}"
          ARGS="$ARGS --os-patch ${{ github.event.inputs.os_patch_level }}"
          [ -n "${{ github.event.inputs.revision }}" ] && ARGS="$ARGS --revision ${{ github.event.inputs.revision }}"
          ARGS="$ARGS --ksu-version ${{ github.event.inputs.kernelsu_version }}"

          # SUSFS / KPM / 特性（解耦勾选）
          [ "${{ github.event.inputs.enable_susfs }}" = "true" ] || ARGS="$ARGS --no-susfs"
          [ "${{ github.event.inputs.susfs_builtin }}" = "true" ] || ARGS="$ARGS --susfs-main"
          [ "${{ github.event.inputs.use_kpm }}" = "disabled (关闭)" ] && ARGS="$ARGS --no-kpm"
          [ "${{ github.event.inputs.use_zram }}" = "true" ] && ARGS="$ARGS --zram"
          [ "${{ github.event.inputs.BBG }}" = "true" ] && ARGS="$ARGS --bbg"
          [ "${{ github.event.inputs.cve_2026_43499_patch }}" = "true" ] && ARGS="$ARGS --cve-2026-43499"
          [ "${{ github.event.inputs.supp_op }}" = "true" ] && ARGS="$ARGS --op8e"
          [ "${{ github.event.inputs.set_defbbr }}" = "true" ] && ARGS="$ARGS --bbr"

          # commit 锁定
          [ -z "${{ github.event.inputs.kernelsu_commit }}" ] || ARGS="$ARGS --ksu-commit=${{ github.event.inputs.kernelsu_commit }}"
          [ -z "${{ github.event.inputs.susfs_commit }}" ] || ARGS="$ARGS --susfs-commit=${{ github.event.inputs.susfs_commit }}"

          # 伪装（勾选后生效；自动补/去前导 '-'）
          if [ "${{ github.event.inputs.spoof_version }}" = "true" ] && [ -n "${{ github.event.inputs.custom_version }}" ]; then
            CV="${{ github.event.inputs.custom_version }}"
            case "$CV" in
              -*) ARGS="$ARGS --custom-version=$CV" ;;
              *)  ARGS="$ARGS --custom-version=-$CV" ;;
            esac
          fi

          python3 build.py $ARGS

      - name: Prepare artifacts
        run: |
          mkdir -p artifacts
          find /tmp/gki-build -name "*.zip" -type f -exec cp {} artifacts/ \;
          find /tmp/gki-build -name "*.img" -type f -exec cp {} artifacts/ \;

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: kernel-${{ github.event.inputs.android_version }}-${{ github.event.inputs.kernel_version }}-${{ github.event.inputs.sub_level }}
          path: artifacts/*
          if-no-files-found: error

      - name: Generate checksums
        run: |
          echo "=== Creating checksums ==="
          sha256sum artifacts/* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Send Telegram Notification
        if: ${{ github.event.inputs.send_telegram == 'true' && success() }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_MESSAGE_THREAD_ID: ${{ secrets.TELEGRAM_MESSAGE_THREAD_ID }}
        run: |
          cd ./.github/workflows/scripts
          python3 telegram_notify.py single \
            "${{ github.event.inputs.android_version }}" \
            "${{ github.event.inputs.kernel_version }}" \
            "${{ github.event.inputs.sub_level }}" \
            "${{ github.event.inputs.os_patch_level }}" \
            "${{ github.event.inputs.kernelsu_version }}" \
            "${{ github.event.inputs.use_zram }}" \
            "${{ (github.event.inputs.use_kpm != 'disabled (关闭)') && 'true' || 'false' }}" \
            "../../SHA256SUMS.txt"
